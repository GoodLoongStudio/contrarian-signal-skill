name: Agent Skill CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release structure and research boundary
        run: python scripts/validate_skill.py "$GITHUB_WORKSPACE"

      - name: Run calculator unit tests
        run: python -m unittest discover -s tests -v

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate Agent Skill specification
        run: uvx --from git+https://github.com/agentskills/agentskills#subdirectory=skills-ref skills-ref validate "$GITHUB_WORKSPACE"
