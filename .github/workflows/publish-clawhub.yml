name: Publish Skill to ClawHub

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "agents/**"
      - "assets/**"
      - "evals/**"
      - "examples/**"
      - "references/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/publish-clawhub.yml"
  workflow_dispatch:

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: .
      dry_run: true

  publish:
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: .
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
